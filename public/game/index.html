<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Hisstory</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1792 height=1344 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // 让画布自适应窗口：保持 4:3 比例，并用背景色填充剩余区域
      function resizeResponsive() {
        try {
          var targetRatio = 1792 / 1344; // Unity 构建的原始比例（4:3）
          var viewportW = window.innerWidth;
          var viewportH = window.innerHeight;
          var viewportRatio = viewportW / viewportH;
          var finalW;
          var finalH;

          // contain 策略：保证完整的 4:3 内容可见，多余空间由背景填充
          if (viewportRatio > targetRatio) {
            // 屏幕偏宽，限制宽度，增加左右黑边
            finalH = viewportH;
            finalW = viewportH * targetRatio;
          } else {
            // 屏幕偏高，限制高度，增加上下黑边
            finalW = viewportW;
            finalH = viewportW / targetRatio;
          }

          // 使用 flex 居中，避免拉伸
          container.style.position = "fixed";
          container.style.inset = "0";
          container.style.display = "flex";
          container.style.alignItems = "center";
          container.style.justifyContent = "center";
          container.style.width = "100%";
          container.style.height = "100%";
          container.style.overflow = "hidden";
          container.style.backgroundColor = '#000000';

          canvas.style.width = finalW + "px";
          canvas.style.height = finalH + "px";
          canvas.style.maxWidth = "100%";
          canvas.style.maxHeight = "100%";
          canvas.style.backgroundColor = '#000000';
        } catch (err) {
          console.error("Failed to resize canvas responsively:", err);
        }
      }
      resizeResponsive();
      window.addEventListener("resize", resizeResponsive);

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl_test.loader.js";
      var config = {
        dataUrl: buildUrl + "/webgl_test.data.br",
        frameworkUrl: buildUrl + "/webgl_test.framework.js.br",
        codeUrl: buildUrl + "/webgl_test.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Hisstory",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      // Unity 实例引用，用于跨窗口暂停/恢复
      var unityInstanceRef = null;

      function pauseGame() {
        try {
          console.log('[Unity WebGL] pauseGame triggered');
          if (!unityInstanceRef || !unityInstanceRef.Module) return;
          console.log('[Unity WebGL] Unity instance ready:', !!unityInstanceRef);
          if (unityInstanceRef.Module.pauseMainLoop) {
            console.log('[Unity WebGL] pauseMainLoop available, invoking');
            unityInstanceRef.Module.pauseMainLoop();
          }
          if (unityInstanceRef.Module.audioContext && unityInstanceRef.Module.audioContext.suspend) {
            console.log('[Unity WebGL] suspending audio context');
            unityInstanceRef.Module.audioContext.suspend();
          }
        } catch (err) {
          console.error("Pause game failed:", err);
        }
      }

      function resumeGame() {
        try {
          console.log('[Unity WebGL] resumeGame triggered');
          if (!unityInstanceRef || !unityInstanceRef.Module) return;
          if (unityInstanceRef.Module.resumeMainLoop) {
            console.log('[Unity WebGL] resumeMainLoop available, invoking');
            unityInstanceRef.Module.resumeMainLoop();
          }
          if (unityInstanceRef.Module.audioContext && unityInstanceRef.Module.audioContext.resume) {
            console.log('[Unity WebGL] resuming audio context');
            unityInstanceRef.Module.audioContext.resume();
          }
        } catch (err) {
          console.error("Resume game failed:", err);
        }
      }

      // 暴露到 window，便于父页面直接调用
      window.pauseGame = pauseGame;
      window.resumeGame = resumeGame;

      // 接收父页面 postMessage 的暂停/恢复指令
      window.addEventListener("message", function (event) {
        try {
          console.log('[Unity WebGL] postMessage received:', event.data);
          if (!event.data || typeof event.data.type !== "string") return;
          if (event.data.type === "pause") {
            pauseGame();
          } else if (event.data.type === "resume") {
            resumeGame();
          }
        } catch (err) {
          console.error("Handle postMessage failed:", err);
        }
      });

      // 全屏/可见性/焦点保护：在 iframe 内可能不触发，但保留兜底
      document.addEventListener("fullscreenchange", function () {
        if (!document.fullscreenElement) {
          pauseGame();
        }
      });
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          pauseGame();
        } else {
          resumeGame();
        }
      });
      window.addEventListener("blur", pauseGame);
      window.addEventListener("focus", resumeGame);

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          unityInstanceRef = unityInstance;
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
